services:
  api1:
    build: .
    volumes:
      - dbdata:/data
    networks:
      - backend

  api2:
    build: .
    volumes:
      - dbdata:/data
    networks:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend

volumes:
  dbdata:

networks:
  backend:
